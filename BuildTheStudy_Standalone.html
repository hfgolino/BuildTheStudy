<style>
/* Build the Study: Week 12 lab.
   Layout idea: a dark blueprint table; every decision is a paper card laid on it. */
:root {
  --table: #0d1626;        /* the table */
  --table-2: #14223a;      /* raised table areas */
  --grid: rgba(120, 170, 230, 0.07);
  --paper: #f2f5f9;        /* cards */
  --paper-2: #e3e9f1;
  --ink: #13203a;          /* text on paper */
  --ink-soft: #4d5b74;
  --chalk: #e8eef7;        /* text on the table */
  --chalk-soft: #9fb0c8;
  --accent: #e57200;       /* UVA orange: treatment, primary actions */
  --accent-ink: #b45400;
  --cyan: #3aa6d8;         /* comparison group */
  --good: #1f9d55;
  --bad: #d23b3b;
  --warn: #c98a00;
  --hidden-lo: #6c4cf5;    /* hidden variable gradient */
  --hidden-hi: #f6c445;
  --radius: 14px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--table);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px clamp(16px, 3vw, 32px);
  background: rgba(13, 22, 38, 0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--chalk); }
.brand-mark { width: 28px; height: 28px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: 0.2px; }
.pips { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.pip {
  font-size: 13px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14); color: var(--chalk-soft);
  background: transparent;
}
.pip.done { color: var(--chalk); border-color: rgba(31,157,85,0.7); background: rgba(31,157,85,0.18); }
.pip.now { color: #fff; border-color: var(--accent); background: rgba(229,114,0,0.22); font-weight: 700; }
.tools { display: flex; align-items: center; gap: 8px; }
.clock { font-family: var(--font-mono); font-size: 14px; color: var(--chalk-soft); padding: 0 6px; }
.clock.late { color: var(--hidden-hi); }
.icon-btn {
  border: 1px solid rgba(255,255,255,0.18); background: transparent; color: var(--chalk);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; min-height: 36px;
}
.icon-btn:hover { background: rgba(255,255,255,0.07); }

main { padding: clamp(16px, 3vw, 32px); max-width: 1280px; margin: 0 auto; outline: none; }

/* ---------- generic paper ---------- */
.paper {
  background: var(--paper); color: var(--ink);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.6) inset;
}
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.muted { color: var(--ink-soft); }
.on-table .muted, .table-text .muted { color: var(--chalk-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; cursor: pointer;
  padding: 12px 20px; min-height: 46px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: #fff;
  box-shadow: 0 4px 0 var(--accent-ink);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-ink); }
.btn[disabled] { background: #8d98aa; box-shadow: 0 4px 0 #6b7586; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--paper-2); }
.btn.ghost.light { color: var(--chalk); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
.btn.small { padding: 8px 14px; min-height: 38px; font-size: 14px; }

/* ---------- start screen ---------- */
.start { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 12px; }
.start-hero h1 { font-size: clamp(40px, 6vw, 72px); font-weight: 800; letter-spacing: -1px; }
.start-hero h1 em { font-style: normal; color: var(--accent); }
.start-hero .lede { font-size: 19px; color: var(--chalk-soft); margin-top: 14px; max-width: 58ch; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-top: 26px; }
.flow-step { background: var(--table-2); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; }
.flow-step b { display: block; font-family: var(--font-display); font-size: 16px; color: #fff; }
.flow-step span { font-size: 13.5px; color: var(--chalk-soft); }
.flow-step .n { font-family: var(--font-mono); color: var(--accent); font-size: 12px; }
.missions-preview { display: grid; gap: 10px; margin-top: 22px; }
.mp { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.14); }
.mp .badge { font-family: var(--font-mono); font-size: 12px; color: var(--table); background: var(--chalk); border-radius: 6px; padding: 2px 7px; font-weight: 700; }
.mp q { font-style: italic; color: var(--chalk); }

.team-card { padding: 24px; display: grid; gap: 16px; }
.team-card h2 { font-size: 26px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field textarea, .field select {
  border: 2px solid var(--paper-2); background: #fff; color: var(--ink);
  border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.id-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.roles { display: grid; gap: 8px; font-size: 14.5px; background: var(--paper-2); border-radius: 12px; padding: 12px 14px; }
.roles b { font-family: var(--font-display); }
.err { color: var(--bad); font-weight: 700; font-size: 14px; min-height: 1.2em; }

/* ---------- mission layout ---------- */
.mission-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 18px; }
.mission-head h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; }
.claim-quote { font-family: var(--font-display); font-size: clamp(20px, 2.6vw, 28px); color: #fff; margin-top: 6px; }
.claim-quote::before { content: "\201C"; color: var(--accent); }
.claim-quote::after { content: "\201D"; color: var(--accent); }
.role-chip { font-size: 13.5px; color: var(--chalk-soft); background: var(--table-2); border-radius: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.08); max-width: 330px; }
.role-chip b { color: var(--chalk); }

.brief { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.brief .paper { padding: 14px 16px; }
.brief h3 { font-size: 13px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-soft); margin-bottom: 4px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.steps { display: grid; gap: 16px; }
.step { padding: 18px 18px 20px; }
.step-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.step-title .n { font-family: var(--font-mono); font-size: 13px; color: #fff; background: var(--ink); border-radius: 6px; padding: 2px 8px; }
.step-title h2 { font-size: 21px; }
.step-title .hint { font-size: 14px; color: var(--ink-soft); margin-left: auto; text-align: right; }

.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.opt {
  position: relative; text-align: left; cursor: pointer;
  border: 2px solid var(--paper-2); background: #fff; color: var(--ink);
  border-radius: 12px; padding: 12px 12px 12px; display: grid; gap: 6px;
  transition: border-color .15s, transform .12s, box-shadow .15s;
}
.opt:hover { border-color: #b9c6d8; transform: translateY(-1px); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229,114,0,0.18); }
.opt[aria-pressed="true"]::after {
  content: "Chosen"; position: absolute; top: 10px; right: 10px;
  font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px;
}
.opt[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.opt .ic { width: 34px; height: 34px; color: var(--ink); }
.opt b { font-family: var(--font-display); font-size: 16.5px; padding-right: 54px; }
.opt .desc { font-size: 14px; color: var(--ink-soft); }
.opt .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--paper-2); color: var(--ink); font-weight: 700; }
.chip.cost { background: #fff1e3; color: var(--accent-ink); }
.chip.why { background: #e8f3fa; color: #145a7d; font-weight: 400; }

.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.check {
  display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start;
  border: 2px solid var(--paper-2); background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer;
}
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.check b { font-size: 15px; }
.check .desc { font-size: 13.5px; color: var(--ink-soft); grid-column: 2; }
.check.on { border-color: var(--accent); }
.check.disabled { opacity: .45; cursor: not-allowed; }

.slider-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); height: 34px; }
.n-readout { font-family: var(--font-mono); font-size: 26px; font-weight: 700; min-width: 110px; text-align: right; }
.people { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 10px; }
.people i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); opacity: .55; display: block; }

/* side panel */
.side { position: sticky; top: 76px; display: grid; gap: 14px; }
.budget { padding: 16px; }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; }
.budget-top b { font-family: var(--font-display); font-size: 17px; }
.budget-num { font-family: var(--font-mono); font-size: 30px; font-weight: 700; }
.budget-num.over { color: var(--bad); }
.bar { height: 14px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin: 8px 0 10px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #f39a3d); border-radius: 999px; transition: width .25s ease; }
.bar.over > span { background: var(--bad); }
.cost-lines { display: grid; gap: 3px; font-size: 13.5px; }
.cost-lines div { display: flex; justify-content: space-between; gap: 10px; }
.summary { padding: 16px; font-size: 14.5px; display: grid; gap: 8px; }
.summary h3 { font-size: 17px; }
.summary ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.label-pick { padding: 16px; display: grid; gap: 10px; }
.label-pick h3 { font-size: 17px; }
.label-pick p { font-size: 14px; }

/* ---------- modal: ethics board ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(5, 10, 20, 0.72); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 26px; position: relative; }
.modal h2 { font-size: 26px; margin-bottom: 6px; }
.verdicts { display: grid; gap: 10px; margin: 16px 0 18px; }
.verdict { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; background: #fff; border-radius: 12px; padding: 12px; border: 2px solid var(--paper-2); }
.verdict .mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-family: var(--font-display); }
.verdict.ok .mark { background: var(--good); }
.verdict.no .mark { background: var(--bad); }
.verdict.meh .mark { background: var(--warn); }

/* measurement helpers */
function addError(trueVals, rel, r) {
  const v = variance(trueVals);
  const sdE = Math.sqrt(v * (1 - rel) / rel);
  return trueVals.map((t) => t + normal(r) * sdE);
}
function sampleForPlot(arr, r, max = 260) {
  if (arr.length <= max) return arr.slice();
  return shuffle(arr, r).slice(0, max);
}
function binMeans(xs, ys, edges) {
  const out = [];
  for (let b = 0; b < edges.length - 1; b++) {
    const vals = []; let xsum = 0;
    for (let i = 0; i < xs.length; i++) if (xs[i] >= edges[b] && (xs[i] < edges[b + 1] || (b === edges.length - 2 && xs[i] <= edges[b + 1]))) { vals.push(ys[i]); xsum += xs[i]; }
    out.push({ lo: edges[b], hi: edges[b + 1], n: vals.length, m: vals.length ? mean(vals) : NaN, x: vals.length ? xsum / vals.length : (edges[b] + edges[b + 1]) / 2 });
  }
  return out;
}
function wideCI(stats, unitWidth) { return stats && (stats.hi - stats.lo) > unitWidth; }
function rangeText(stats, d) { return `${fmt(stats.lo, d, true)} to ${fmt(stats.hi, d, true)}`; }
const assocPos = (res) => !!(res && res.assoc && res.assoc.lo > 0);

function submitToBoard(i) {
  const m = MISSIONS[i], st = currentRound(i), ch = st.ch;

  const verdict = items.some((x) => x.s === 'reject') ? 'rejected' : items.some((x) => x.s === 'revise') ? 'revise' : 'approved';
  let labelHtml = '';

    st.labelSubmitted = st.label;

    labelHtml = `<div class="verdict ${st.labelOk ? 'ok' : 'no'}"><span class="mark">${st.labelOk ? '✓' : '✕'}</span><div><b>Design type: you said “${esc(labelName(st.label))}.” ${st.labelOk ? 'Correct.' : `It is a ${esc(correctLabels(m, ch).map(labelName).join(' (or ') + (correctLabels(m, ch).length > 1 ? ')' : ''))}.`}</b>${esc(labelExplain(m, ch))}</div></div>`;
  }
  save();

  setTimeout(() => (verdict === 'approved' ? sfx.good() : sfx.bad()), 300);

    <div class="paper modal" role="dialog" aria-modal="true" aria-labelledby="ebTitle">
      <span class="stamp ${verdict}">${stampText}</span>
      <p class="kicker">Ethics and Feasibility Board</p>
      <h2 id="ebTitle">${verdict === 'approved' ? 'You may run it.' : verdict === 'revise' ? 'Fix this and resubmit.' : 'Not this design.'}</h2>
      <p class="muted">Submission ${st.attempts} for Mission ${m.num}${state.round === 1 ? ', Round 2' : ''}.${verdict === 'approved' ? (st.firstPass ? ' First try: +10 points.' : ' Approved after a revision: no first-try bonus.') : ''}</p>
      <div class="verdicts">
        ${items.map((x) => `<div class="verdict ${x.s === 'ok' ? 'ok' : x.s === 'revise' ? 'meh' : 'no'}"><span class="mark">${mk[x.s]}</span><div><b>${esc(x.t)}</b>${esc(x.x)}</div></div>`).join('')}
        ${labelHtml}
      </div>
      <div class="modal-actions">
        ${verdict === 'approved' ? '<button class="btn" id="runBtn" type="button">Run the study</button>' : '<button class="btn" id="backBtn" type="button">Back to the design</button>'}
      </div>
    </div>`, verdict !== 'approved');
  if (verdict === 'approved') {
    burst();
    $('#runBtn').onclick = () => { closeModal(); sfx.run(); go('results'); };
    $('#runBtn').focus();
  } else {
    $('#backBtn').onclick = closeModal; $('#backBtn').focus();
  }
  announce(`Ethics board: ${stampText}.`);
}

  if (a.measure !== b.measure) out.push(`Outcome: ${t(m.measures, a.measure)} → ${t(m.measures, b.measure)}`);

const REFL_BASE = [
  'Which claim was most tempting to make even though your design could not support it? What about the design blocked it?',
  'Pick one mission. If you could run one more study, what would you change in the design, and what new claim would that let you make?',
];
const REFL_REPLAY = 'Pick a mission you replayed. What did you change in the design, how did the results and the claims you could defend change, and why?';
const anyReplay = () => state.missions.some((x) => x.replay && x.replay.submitted);

const MIN_WORDS = 20;
function rankFor(total, over) {
  if (total >= 260 && over === 0) return ['Reviewer 2’s Worst Nightmare', 'Every claim matched the design. Nothing for Reviewer 2 to do.'];
  if (total >= 220) return ['Careful Scientist', 'You claimed what your designs earned, almost every time.'];
  if (over >= 4) return ['Press Release Writer', 'Bold headlines. Your designs could not back several of them.'];
  if (total >= 160) return ['Promising Researcher', 'Solid instincts, a few slips between design and claim.'];
  return ['Back to Section Two', 'Reread Searle’s summary table (p. 30) before the next quiz.'];
}
function roundCode(m, i, r) {
  const st = roundObj(i, r), sc = scoreMission(i, r) || { total: 0, detail: [] };
  const marks = m.claims.map((c) => (st.marks[c.id] === 'yes' ? 'Y' : st.marks[c.id] === 'no' ? 'N' : '-')).join('');
  const truth = sc.detail.length ? sc.detail.map((x) => (x.truth ? 'Y' : 'N')).join('') : '----';
  const ch = st.ch;
  return `${ch.alloc || '-'}.${ch.setting || '-'}.${ch.measure || '-'}.${ch.n || 0}.${ch.safe.slice().sort().join('+') || 'none'}.${st.labelSubmitted || '-'}.${st.labelOk ? 1 : 0}.${st.attempts}.${st.firstPass ? 1 : 0}.${marks}.${truth}.${sc.total}`;
}
function machineBlock() {
  const ms = MISSIONS.map((m, i) => {
    const rp = state.missions[i].replay;
    return `m${m.num}=${roundCode(m, i, 0)}${rp && rp.submitted ? `|m${m.num}r=${roundCode(m, i, 1)}` : ''}`;
  }).join('|');
  const tot = MISSIONS.reduce((s, m, i) => s + ((bestScore(i) || {}).total || 0), 0);
  const over = MISSIONS.reduce((s, m, i) => s + ((bestScore(i) || {}).over || 0), 0);
  const mins = state.finishedAt && state.startedAt ? Math.round((state.finishedAt - state.startedAt) / 60000) : 0;
  const body = `BTS1|ids=${state.ids.join('+')}|${ms}|w=${words(state.refl[0])}.${words(state.refl[1])}|rh=${hex8(fnv(state.refl.join('␞')))}|t=${tot}|oc=${over}|min=${mins}`;
  return { body, code: hex8(fnv(`${body}|${SALT}`)), tot, over };
}
function ticketText() {
  const { body, code, tot, over } = machineBlock();

  L.push('BUILD THE STUDY: EXIT TICKET');
  L.push('Research Methods & Data Analysis I, University of Virginia, Week 12');
  L.push(`Team: ${state.team}`);

    const rounds = [0, 1].filter((r) => scoreMission(i, r));
    const best = bestScore(i);
    L.push(`Mission ${m.num}: ${m.title}  "${m.claim}"`);
    rounds.forEach((r) => {
      const st = roundObj(i, r), sc = scoreMission(i, r), ch = st.ch;
      if (rounds.length > 1) L.push(`  [Round ${r + 1}${best.round === r ? ', counted' : ''}]`);
      L.push(`  Design: ${summarySentences(m, ch).map((s) => s.replace(/<[^>]+>/g, '')).join(' ')}`);
      L.push(`  You named it: ${labelName(st.labelSubmitted)} (${st.labelOk ? 'correct' : 'incorrect; it is a ' + correctLabels(m, ch).map(labelName).join(' or ')})`);
      L.push(`  Ethics board: ${st.attempts} submission(s)`);
      L.push(`  Result: ${estText(resultFor(i, r))}, likely range ${rangeTextRes(resultFor(i, r))}`);
      m.claims.forEach((c, k) => {
        const d = sc.detail[k];
        L.push(`  Claim ${k + 1}: ${st.marks[c.id] === 'yes' ? 'CLAIMED' : 'not claimed'}${d.right ? ' (right)' : d.said ? ' (OVERCLAIM)' : ' (missed)'}  ${c.text}`);

  const RP = reflPrompts();
  L.push(`Reflection 1. ${RP[0]}`); L.push(state.refl[0].trim()); L.push('');

  };
  $('#backBtn2').onclick = () => { state.mission = MISSIONS.length - 1; state.round = 0; go('results'); };
  if (!state.ticketCheered && ok) { state.ticketCheered = true; save(); }
  if (!state.cheered) { state.cheered = true; save(); if (tot >= 220) burst(140); }
}

/* ====================================================================
   Modals, method finder, confetti
   ==================================================================== */
let lastFocus = null;
function openModal(html, escClose = true) {
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="modal-backdrop" id="backdrop">${html}</div>`;
  const bd = $('#backdrop');
  bd.addEventListener('click', (e) => { if (e.target === bd && escClose) closeModal(); });
  bd.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && escClose) closeModal();
    if (e.key === 'Tab') {
      const f = $$('button, [href], input, select, textarea', bd).filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
}
function closeModal() { $('#modal-root').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function openConfirm(title, text, okText, onOk) {
  openModal(`<div class="paper modal" role="dialog" aria-modal="true" aria-labelledby="cfT"><h2 id="cfT">${esc(title)}</h2><p class="muted" style="margin:8px 0 18px">${esc(text)}</p><div class="modal-actions"><button class="btn ghost" id="cfNo" type="button">Cancel</button><button class="btn" id="cfYes" type="button">${esc(okText)}</button></div></div>`);
  $('#cfNo').onclick = closeModal; $('#cfYes').onclick = () => { closeModal(); onOk(); }; $('#cfNo').focus();
}
function openFinder() {
  openModal(`<div class="paper modal finder" role="dialog" aria-modal="true" aria-labelledby="mfT">
    <p class="kicker">From Tuesday’s lecture</p>
    <h2 id="mfT">The method finder</h2>
    <ol>
      <li><b>Is there an IV, a difference between conditions you can compare?</b> No: it is non-experimental (correlational study, observation, case study, interview).</li>
      <li><b>Could the researcher put anyone in any condition (random allocation)?</b> Yes: a true experiment. In a controlled setting, a lab experiment; in a real setting, a field experiment.</li>
      <li><b>If not, what made the groups differ?</b> A real-life event: a natural experiment. Something people already are or chose: a quasi-experiment.</li>
    </ol>
    <table><thead><tr><th>Design</th><th>Cause and effect?</th><th>Watch out for</th></tr></thead><tbody>
      <tr><td>Lab experiment</td><td>Yes</td><td>Low realism, demand characteristics</td></tr>
      <tr><td>Field experiment</td><td>Yes</td><td>Less control, ethics, cost</td></tr>
      <tr><td>Natural experiment</td><td>With caution</td><td>Other things changed at the same time</td></tr>
      <tr><td>Quasi-experiment</td><td>With caution</td><td>Groups differ in other ways</td></tr>
      <tr><td>Correlational study</td><td>No</td><td>Direction of the arrow, third variables, curves</td></tr>
      <tr><td>Observation</td><td>No (unless part of an experiment)</td><td>Observer bias; define what you count</td></tr>
      <tr><td>Case study</td><td>No</td><td>A sample of one</td></tr>
    </tbody></table>
    <p class="muted" style="margin-top:10px;font-size:13.5px">Searle (1999), Section Two, summary table p. 30.</p>
    <div class="modal-actions" style="margin-top:14px"><button class="btn" id="mfClose" type="button">Back to the lab</button></div>
  </div>`);
  $('#mfClose').onclick = closeModal; $('#mfClose').focus();
}
function burst(count = 80) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'); if (!g) { c.remove(); return; }
  const cols = ['#E57200', '#3AA6D8', '#F6C445', '#1F9D55', '#F2F5F9'];
  const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 12 - 4, s: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  let t = 0;
  (function frame() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.a += 0.2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (++t < 90) requestAnimationFrame(frame); else c.remove();
  })();
}
